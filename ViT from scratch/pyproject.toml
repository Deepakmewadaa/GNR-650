[project]
name = "gnr650-vit"
version = "0.1.0"
description = "GNR650 Vision Transformer from scratch with FOVI tokenization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22.0",
    "pillow>=9.0.0",
    "torch>=2.0.0",
    "einops>=0.6.0",
    "scipy>=1.8.0",
    "matplotlib>=3.5.0",
    "tqdm>=4.64.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
